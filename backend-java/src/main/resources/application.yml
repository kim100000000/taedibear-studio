spring:
  application:
    name: taedibear-studio-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taedibear_studio}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 개발 환경: update로 엔티티 기준 테이블 4개를 자동 생성/동기화한다 (Node 버전 sequelize.sync({alter:true})와 동일한 역할).
      # 운영 환경에서는 validate 또는 none + 마이그레이션 도구(Flyway 등) 사용을 권장한다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 개선백로그 🟠: @Scheduled 잡 5종(예약 발행 1분/자동 답글 30분/팔로워 스냅샷/월간 크레딧/관리자 리포트)이
  # 기본 단일 스레드를 공유하면 오래 걸리는 잡이 예약 발행을 지연시킬 수 있어 풀을 확장한다.
  task:
    scheduling:
      pool:
        size: 4

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${PORT:4000}

app:
  client-url: ${CLIENT_URL:http://localhost:5173}

  jwt:
    # C8: 기본값 없음 — JWT_SECRET 미설정 시 부팅 실패 (JwtTokenProvider에서 명확한 에러 메시지로 검증)
    secret: ${JWT_SECRET:}
    # C4: refresh token 도입으로 access token 수명을 7일 → 30분으로 단축
    expiration-ms: ${JWT_EXPIRATION_MS:1800000} # 30분

  auth:
    # C4: refresh token (HttpOnly 쿠키, DB 저장·회전)
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:1209600000} # 14일
    # 운영(HTTPS)은 true. 프론트/백엔드가 서로 다른 도메인이면 same-site를 None으로 (None은 Secure=true 필수)
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

  aws:
    region: ${AWS_REGION:ap-northeast-2}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    s3-bucket: ${AWS_S3_BUCKET:taedibear-studio-images}

  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    graph-api-version: ${META_GRAPH_API_VERSION:v19.0}
    redirect-uri: ${META_REDIRECT_URI:http://localhost:4000/api/instagram/callback}

  mail:
    from: ${MAIL_FROM:noreply@taedibear.studio}
    admin: ${ADMIN_EMAIL:}

  toss:
    # 토스페이먼츠 시크릿 키 (운영: 실제 키 필수)
    secret-key: ${TOSS_SECRET_KEY:}
    # 프론트엔드에서 사용하는 클라이언트 키 (VITE_TOSS_CLIENT_KEY 환경변수와 동일하게 설정)
    client-key: ${TOSS_CLIENT_KEY:}
    # 개발 모드: true일 때만 시크릿 키 없이 승인/취소 API 호출을 스킵한다.
    # 기본값 false — 운영에서 키가 누락되면 결제가 실패하도록(무료 Pro 방지) 안전하게 막는다.
    dev-mode: ${TOSS_DEV_MODE:false}

  oauth:
    # C5: OAuth state 쿠키 Secure 플래그 — 운영(HTTPS)은 true, 로컬(http)은 false
    cookie-secure: ${OAUTH_COOKIE_SECURE:false}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_CALLBACK_URL:http://localhost:4000/api/auth/google/callback}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      # 카카오 콘솔 [보안] 탭에서 Client Secret "사용함"이면 필수 (미설정 시 KOE010 invalid_client)
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_CALLBACK_URL:http://localhost:4000/api/auth/kakao/callback}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_CALLBACK_URL:http://localhost:4000/api/auth/naver/callback}

logging:
  level:
    com.taedibear.studio: debug
