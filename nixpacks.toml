[phases.setup]
nixPkgs = ["jdk17"]

[phases.build]
cmds = ["cd backend-java && chmod +x gradlew && ./gradlew build -x test"]

[start]
# 컨테이너 메모리 한도의 70%까지만 힙으로 사용 — JVM 기본값은 상황에 따라 컨테이너 한도를
# 넘겨 잡아서(메타스페이스/스레드/AWS SDK·Netty 오프힙 버퍼 등 감안 못 함) OOM으로 죽는 경우가 있음.
# Railway Metrics에서 메모리 사용량이 컨테이너 한도 근처에 계속 붙어있는 게 보여 추가.
cmd = "cd backend-java && java -XX:MaxRAMPercentage=70.0 -jar build/libs/taedibear-studio-backend-0.0.1-SNAPSHOT.jar"
